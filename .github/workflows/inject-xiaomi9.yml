name: Inject XiaoMi9 Drivers into ESD

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ESD split parts from GitHub Release
        run: |
          $base = "https://github.com/ArKT-7/woawin/releases/download/2026-09-29_211725"
          $files = @(
            "26300.9550.260920-1158.26H2_GE_RELEASE_SVC_PROD3_CLIENTMULTI_A64FRE_ZH-CN_parts.zip.001",
            "26300.9550.260920-1158.26H2_GE_RELEASE_SVC_PROD3_CLIENTMULTI_A64FRE_ZH-CN_parts.zip.002",
            "26300.9550.260920-1158.26H2_GE_RELEASE_SVC_PROD3_CLIENTMULTI_A64FRE_ZH-CN_parts.zip.003"
          )
          foreach ($f in $files) {
            Write-Host "Downloading $f ..."
            curl.exe -L --retry 5 --retry-delay 10 -o $f "$base/$f"
            if (-not (Test-Path $f)) { throw "Failed to download $f" }
          }
          Get-ChildItem *.zip.* | Format-Table Name, Length

      - name: Extract ESD from split zip
        run: |
          7z x "26300.9550.260920-1158.26H2_GE_RELEASE_SVC_PROD3_CLIENTMULTI_A64FRE_ZH-CN_parts.zip.001" -y
          $esd = Get-ChildItem -Recurse -Filter "*.esd" | Select-Object -First 1
          if (-not $esd) { throw "No .esd file found after extraction" }
          Write-Host "Found ESD: $($esd.FullName) ($([math]::Round($esd.Length/1GB, 2)) GB)"
          Move-Item $esd.FullName -Destination install.esd -Force
          Remove-Item "26300.9550.260920-1158.26H2_GE_RELEASE_SVC_PROD3_CLIENTMULTI_A64FRE_ZH-CN_parts.zip.*" -Force -ErrorAction SilentlyContinue
          Get-Item install.esd | Format-List Name, Length

      - name: Download XiaoMi9 Drivers
        run: |
          curl.exe -L -o drivers.7z "https://github.com/qaz6750/XiaoMi9-Drivers/releases/download/2.0.0/XiaoMi9-Drivers-Desktop.7z"

      - name: Extract Drivers
        run: |
          7z x drivers.7z -oDrivers -y
          Get-ChildItem Drivers -Recurse -Filter "*Offline*" | Format-Table FullName

      - name: Install .NET 8 Desktop Runtime
        run: |
          curl.exe -L -o dotnet-desktop-runtime.exe "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe"
          Start-Process -FilePath ".\dotnet-desktop-runtime.exe" -ArgumentList "/install","/quiet","/norestart" -Wait -NoNewWindow
          Write-Host ".NET Desktop Runtime install finished"

      - name: Show ESD info
        run: dism /Get-WimInfo /WimFile:install.esd

      - name: Convert ESD to WIM
        run: |
          dism /Export-Image /SourceImageFile:install.esd /SourceIndex:1 /DestinationImageFile:install.wim /Compress:max /CheckIntegrity
          Remove-Item install.esd -Force -ErrorAction SilentlyContinue

      - name: Mount WIM
        run: |
          New-Item -ItemType Directory -Path C:\Mount -Force | Out-Null
          dism /Mount-Wim /WimFile:install.wim /Index:1 /MountDir:C:\Mount

      - name: Map mount dir to drive letter
        run: 'subst X: C:\Mount'

      - name: Run OfflineUpdater.cmd with drive letter
        shell: cmd
        run: |
          cd /d Drivers
          echo X: | OfflineUpdater.cmd

      - name: Remove drive mapping
        run: 'subst X: /D'

      - name: Commit and unmount
        run: dism /Unmount-Wim /MountDir:C:\Mount /Commit

      - name: Split WIM into 4 parts (.001 .002 .003 .004)
        run: |
          $wim = Get-Item install.wim
          Write-Host "WIM size: $([math]::Round($wim.Length/1GB, 2)) GB"
          # 使用 7z 按约 2GB 分卷压缩（无压缩，只拆分）
          7z a -v2000m -mx0 install.wim.7z install.wim
          Get-ChildItem install.wim.7z* | Format-Table Name, Length
          # 重命名为更友好的 .001 .002 ... 形式
          $parts = Get-ChildItem "install.wim.7z.*" | Sort-Object Name
          $i = 1
          foreach ($p in $parts) {
            $newName = "install.wim.7z.{0:D3}" -f $i
            Rename-Item $p.FullName $newName
            $i++
          }
          Get-ChildItem "install.wim.7z.*" | Format-Table Name, Length

      - name: Create Release and upload split parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "modified-$(Get-Date -Format 'yyyy-MM-dd_HHmmss')"
          $title = "Modified install.wim with XiaoMi9 Drivers ($tag)"
          $body = @"
          ### Modified Windows image with XiaoMi 9 drivers injected

          - Source ESD: ArKT-7/woawin 2026-09-29_211725
          - Drivers: qaz6750/XiaoMi9-Drivers 2.0.0
          - Split into ~2GB parts for easier download

          **How to use:**
          1. Download all ``.001`` ``.002`` ``.003`` ``.004`` parts
          2. Place them in the same folder
          3. Use 7-Zip to extract the first part (``.001``), it will auto-combine the rest
          4. You will get ``install.wim``
          "@

          # 创建 release
          gh release create $tag --title "$title" --notes "$body" --repo ${{ github.repository }}

          # 上传所有分卷
          Get-ChildItem "install.wim.7z.*" | ForEach-Object {
            Write-Host "Uploading $($_.Name) ..."
            gh release upload $tag $_.FullName --repo ${{ github.repository }} --clobber
          }

          Write-Host "Release created: https://github.com/${{ github.repository }}/releases/tag/$tag"
